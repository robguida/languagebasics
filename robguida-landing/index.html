<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Rob Guida</title>
  <meta name="description" content="A couple of little things Rob built and likes to share." />

  <style>
    :root {
      --bg: #0f1419;
      --card: #1a212b;
      --text: #e8edf2;
      --muted: #9aa7b4;
      --accent: #4f9cf9;
      --border: #2a333f;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .headline {
      font-size: 2rem;
      font-weight: 700;
      margin: 0 0 8px;
    }

    .subhead {
      font-size: 1.05rem;
      color: var(--muted);
      margin: 0 0 32px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .portal-link {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.15s ease, transform 0.15s ease;
    }

    .portal-link:hover,
    .portal-link:focus-visible {
      border-color: var(--accent);
      transform: translateY(-2px);
      outline: none;
    }

    .portal-link .label {
      font-size: 1.15rem;
      font-weight: 600;
    }

    .portal-link .desc {
      font-size: 0.92rem;
      color: var(--muted);
      margin-top: 4px;
    }

    footer {
      margin-top: 40px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    @media (max-width: 420px) {
      .headline { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="headline">Hi, I'm Rob.</h1>
    <p class="subhead">A couple of little things I built and like to share.</p>

    <nav class="links">
      <!-- LINK 1: US debt clock — href is FIXED, do not change. -->
      <a class="portal-link" href="https://usdebt.robguida.com">
        <span class="label">US Debt Clock</span>
        <span class="desc">Watch the US national debt tick by, live.</span>
      </a>

      <!-- LINK 2: Language Basics — href is FIXED, do not change. -->
      <a class="portal-link" href="https://languagebasics.robguida.com">
        <span class="label">Albanian Basics</span>
        <span class="desc">Flashcards for learning your first Albanian words.</span>
      </a>
    </nav>

    <footer>Built by Rob.</footer>
  </main>
</body>
</html>
