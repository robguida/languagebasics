<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Albanian Numbers Flashcards</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #ffffff;
      --text: #111827;
      --muted: #64748b;
      --accent: #2563eb;
      --accent2: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1e3a8a, var(--bg));
      color: var(--card);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .app { width: min(480px, 100%); text-align: center; }
    h1 { font-size: 1.25rem; font-weight: 700; margin: 0 0 14px; }
    .card {
      background: var(--card);
      color: var(--text);
      border-radius: 28px;
      min-height: 360px;
      padding: 28px 20px;
      box-shadow: 0 24px 60px rgba(0,0,0,.3);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .label { color: var(--muted); font-size: 1rem; margin-bottom: 8px; }
    .number { font-size: clamp(7rem, 32vw, 11rem); line-height: 1; font-weight: 800; }
    .word { font-size: clamp(3rem, 14vw, 5rem); line-height: 1.05; font-weight: 800; color: var(--accent); margin-top: 16px; }
    .pronunciation { font-size: 1.4rem; color: var(--muted); margin-top: 10px; }
    .timer { margin: 18px auto 0; width: 100%; height: 10px; background: rgba(255,255,255,.25); border-radius: 99px; overflow: hidden; }
    .bar { width: 100%; height: 100%; background: var(--accent2); transform-origin: left; animation: shrink 5s linear forwards; }
    @keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    button {
      border: 0;
      border-radius: 14px;
      padding: 14px 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      color: white;
      background: var(--accent);
    }
    button.secondary { background: #475569; }
    .hint { color: #cbd5e1; font-size: .95rem; margin-top: 12px; }
  </style>
</head>
<body>
  <main class="app">
    <h1>Albanian Numbers: 20–90</h1>
    <section class="card" aria-live="polite">
      <div class="label" id="label">What is this number in Albanian?</div>
      <div class="number" id="number">1</div>
      <div class="word" id="word" hidden>një</div>
      <div class="pronunciation" id="pronunciation" hidden>nyuh</div>
    </section>
    <div class="timer"><div class="bar" id="bar"></div></div>
    <div class="controls">
      <button id="nextBtn">Next Card</button>
      <button class="secondary" id="showBtn">Show Now</button>
    </div>
    <div class="hint">A new random number appears. After 5 seconds, the Albanian word appears.</div>
  </main>

  <script>
    const cards = [
      { n: 20, word: "njëzet", pronunciation: "nyuh-ZET" },
      { n: 30, word: "tridhjetë", pronunciation: "tree-DHYET-uh" },
      { n: 40, word: "dyzet", pronunciation: "doo-ZET" },
      { n: 50, word: "pesëdhjetë", pronunciation: "peh-suh-DHYET-uh" },
      { n: 60, word: "gjashtëdhjetë", pronunciation: "gyasht-uh-DHYET-uh" },
      { n: 70, word: "shtatëdhjetë", pronunciation: "shtaht-uh-DHYET-uh" },
      { n: 80, word: "tetëdhjetë", pronunciation: "teh-tuh-DHYET-uh" },
      { n: 90, word: "nëntëdhjetë", pronunciation: "nuhn-tuh-DHYET-uh" }
    ];

    const numberEl = document.getElementById("number");
    const wordEl = document.getElementById("word");
    const pronEl = document.getElementById("pronunciation");
    const labelEl = document.getElementById("label");
    const barEl = document.getElementById("bar");
    const nextBtn = document.getElementById("nextBtn");
    const showBtn = document.getElementById("showBtn");

    let current = null;
    let timer = null;
    let lastNumber = null;

    function randomCard() {
      let card;
      do {
        card = cards[Math.floor(Math.random() * cards.length)];
      } while (cards.length > 1 && card.n === lastNumber);
      lastNumber = card.n;
      return card;
    }

    function resetBar() {
      barEl.style.animation = "none";
      void barEl.offsetWidth;
      barEl.style.animation = "shrink 5s linear forwards";
    }

    function showAnswer() {
      if (!current) return;
      wordEl.hidden = false;
      pronEl.hidden = false;
      labelEl.textContent = "Albanian spelling:";
      clearTimeout(timer);
      barEl.style.animationPlayState = "paused";
    }

    function nextCard() {
      current = randomCard();
      numberEl.textContent = current.n;
      wordEl.textContent = current.word;
      pronEl.textContent = current.pronunciation;
      wordEl.hidden = true;
      pronEl.hidden = true;
      labelEl.textContent = "What is this number in Albanian?";
      clearTimeout(timer);
      resetBar();
      timer = setTimeout(showAnswer, 5000);
    }

    nextBtn.addEventListener("click", nextCard);
    showBtn.addEventListener("click", showAnswer);
    document.addEventListener("keydown", (event) => {
      if (event.key === " " || event.key === "Enter") showAnswer();
      if (event.key.toLowerCase() === "n") nextCard();
    });

    nextCard();
  </script>
</body>
</html>
